[package]
name = "code-toolbox"
version = "0.4.4"
license = "MIT"
description = "Code Toolbox: open VS Code projects and profiles from the menu bar / tray"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to a minor version: the macOS tray highlight reaches into tray-icon's NSStatusItem
# (`with_inner_tray_icon`), whose types must match the objc2 crates below.
tauri = { version = "~2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toolbox-core = { version = "0.1.0", path = "../../core" }
notify = "8.2.0"
sys-locale = "0.3.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-updater = "2.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSButton", "NSCell", "NSControl", "NSResponder", "NSStatusItem", "NSView", "NSWindow", "NSPanel"] }
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
